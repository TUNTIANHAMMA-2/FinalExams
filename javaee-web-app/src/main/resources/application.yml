spring:
  application:
    name: logistics-management
  profiles:
    active: dev

mybatis-plus:
  type-aliases-package: com.finalexams.logistics.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
